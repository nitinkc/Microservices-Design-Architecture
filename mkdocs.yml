site_name: Microservices Architecture
site_description: Systematic breadth-first guide — design, code, and deploy microservices for architects
site_author: Senior Developer Transition Guide

theme:
  name: mkdocs

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list

nav:
  - Home: index.md
  - Design & Patterns:
    - "01 · Architectural Foundations": 01-foundations/index.md
    - "02 · Domain-Driven Design": 02-ddd/index.md
    - "03 · Microservices Patterns": 03-microservices-patterns/index.md
    - "04 · Event-Driven Architecture": 04-event-driven/index.md
  - Integration & Runtime:
    - "05 · API & Communication": 05-api-communication/index.md
    - "06 · Resilience & Reliability": 06-resilience/index.md
    - "07 · Observability": 07-observability/index.md
  - Operations & Security:
    - "08 · Security": 08-security/index.md
    - "09 · Deployment & Infrastructure": 09-deployment/index.md
  - Resources:
    - "10 · Interview Prep": 10-interview/index.md

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js
  - https://unpkg.com/mermaid@10/dist/mermaid.js
  - js/mermaid-init.js

extra_css:
  - https://unpkg.com/mermaid@10/dist/mermaid.css
