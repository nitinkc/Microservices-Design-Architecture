site_name: Microservices Architecture
site_description: Systematic breadth-first guide — design, code, and deploy microservices for architects
site_author: Senior Developer Transition Guide

theme:
  name: mkdocs
  color_mode: auto
  user_color_mode_toggle: true

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list

nav:
  - Home: index.md
  - Design & Patterns:
    - "01 · Architectural Foundations":
